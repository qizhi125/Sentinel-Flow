name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make build

      - name: Tests
        run: make test

      - name: Lints
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          go vet ./go/...

      - name: Format checks
        run: |
          cargo fmt --all -- --check
          test -z "$(gofmt -l go)"

      - name: End-to-end smoke
        run: |
          go build -o /tmp/sentinel-web ./go/cmd/sentinel-web
          /tmp/sentinel-web --no-open &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS --max-time 1 http://127.0.0.1:21318/v1/health >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS --max-time 5 http://127.0.0.1:21318/v1/health | grep -q ok
          cargo run --bin sentineld -- \
            --pcap data/testdata/curl-enabled-tls13.pcap \
            --rules data/ja3_rules.tsv \
            --api http://127.0.0.1:21318
          curl -fsS --max-time 5 http://127.0.0.1:21318/ | grep -q 'Sentinel-Flow'
